<!DOCTYPE html>
<html lang="en">
<head>

<body>
<div class="wrap">

    el.addEventListener("click", function () {
      try { sessionStorage.setItem("pioneerGoal", el.getAttribute("data-goal")); } catch (e) {}
    });
  });
